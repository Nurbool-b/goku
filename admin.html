  <div class="glass" style="padding:16px;margin-bottom:12px"><b>${t("byMethod")}</b><div class="dv"><span>${t("mCash")}</span><b>${money(mth.cash)}</b></div><div class="dv"><span>Kaspi</span><b>${money(mth.kaspi)}</b></div><div class="dv"><span>${t("mBal")}</span><b>${money(mth.balance)}</b></div></div>
  <div class="glass" style="padding:16px"><b>${t("byZone")}</b>${Object.entries(zs).sort((a,b)=>b[1]-a[1]).map(([z,v])=>`<div style="margin-top:10px"><div class="dv" style="border:0;padding:0"><span>${esc(zname(z))}</span><b>${money(v)}</b></div><div class="zb"><i style="width:${Math.round(v/zt*100)}%"></i></div></div>`).join("")}</div>`}
function tick(){document.querySelectorAll(".tm").forEach(e=>{const p=D.pcs.find(x=>x.id==e.dataset.id);if(!p)return;if(!p.session_end){e.textContent=t("waitC");return}const r=new Date(p.session_end)-Date.now();e.classList.toggle("over",r<=0);
  e.textContent=r<=0?t("over"):t("left")+" "+(Math.floor(r/3600000))+":"+pad(Math.floor(r%3600000/60000))+":"+pad(Math.floor(r%60000/1000))})}
/* ===== actions ===== */
async function act(fn,b,msg){try{const r=await rpc(fn,b);toast(msg||t("sent"));await refresh(true);return r}catch(e){toast(emsg(e))}}
async function confirmR(id){const sl=$("#pm"+id),c=await act("confirm_request",{p_id:id,p_pay:sl?sl.value:"kaspi"},null);if(c)toast(t("code")+": "+c)}
const rejectR=id=>act("reject_request",{p_id:id});
const unlockPc=id=>{closeM();act("unlock_pc",{p_pc:id})};
async function openReceipt(path){const w=window.open("about:blank","_blank");try{const j=await api("/storage/v1/object/sign/receipts/"+path.split("/").map(encodeURIComponent).join("/"),{method:"POST",body:JSON.stringify({expiresIn:600})});w.location=SB.url+"/storage/v1"+j.signedURL}catch(e){if(w)w.close();toast(t("err")+": "+e.message)}}
function cmd(id,a){closeM();act("send_command",{p_pc:id,p_action:a})}
function endS(id,sd){closeM();act("end_session",{p_pc:id,p_shutdown:sd})}
function extend(id,m){const p=D.pcs.find(x=>x.id==id),pay=$("#fm")?$("#fm").value:"cash";closeM();act("extend_session",{p_pc:id,p_minutes:m,p_price:Math.round((D.hp[p.zone]||0)*m/60),p_pay:pay})}
function startForm(id){const s=$("#fh"),o=s.selectedOptions[0],b={p_pc:id,p_client:$("#fn").value,p_phone:$("#fp").value,p_hours:+s.value,p_price:+o.dataset.p,p_pay:$("#fm").value};closeM();act("start_session",b)}
async function patchPc(id,body){try{await api("/rest/v1/pcs?id=eq."+id,{method:"PATCH",headers:{Prefer:"return=minimal"},body:JSON.stringify(body)});closeM();await refresh(true)}catch(e){toast(t("err")+": "+e.message)}}
const bookForm=id=>patchPc(id,{status:"booked",client:$("#fn").value,phone:$("#fp").value});
const cancelB=id=>patchPc(id,{status:"available",client:null,phone:null});
function openSeat(id){const p=D.pcs.find(x=>x.id==id);if(!p)return;let h=`<button class="x" aria-label="Close" onclick="closeM()">×</button><h2>PC ${pad(id)} · ${esc(zname(p.zone))}</h2><p class="pc ${p.status}" style="border:0;box-shadow:none;background:none;padding:0;cursor:default"><span class="st"><i class="dot"></i>${t(p.status)}</span> · ${online(p)?t("on"):t("off")}</p>`;
  if(p.status=="occupied")h+=`<p style="margin-top:10px">${esc(p.client||"—")} · <b class="tm" data-id="${id}"></b></p><p class="live">${t("codePc")}: <b class="g">${esc(p.unlock_code||"—")}</b></p>${p.unlocked?"":`<div class="row2"><button class="btn p" onclick="unlockPc(${id})">${t("unlockB")}</button></div>`}<select id="fm">${payOpts()}</select><div class="row2"><button class="btn" onclick="extend(${id},30)">+30 ${t("min")}</button><button class="btn" onclick="extend(${id},60)">+60 ${t("min")}</button></div><div class="row2"><button class="btn r" onclick="endS(${id},true)">${t("end")}</button></div><div class="row2"><button class="btn" onclick="endS(${id},false)">${t("endk")}</button></div>`;
  else{const hp=D.hp[p.zone]||0;h+=`<input id="fn" placeholder="${t("client")}" value="${esc(p.client||"")}"><input id="fp" type="tel" placeholder="${t("phone")}" value="${esc(p.phone||"")}"><select id="fh">${[1,2,3,5].map(n=>`<option value="${n}" data-p="${n*hp}">${n} ${t("hours")} — ${money(n*hp)}</option>`).join("")}</select><select id="fm">${payOpts()}</select><div class="row2"><button class="btn p" onclick="startForm(${id})">${p.status=="booked"?t("checkin"):t("start")}</button>${p.status=="available"?`<button class="btn o" onclick="bookForm(${id})">${t("bookb")}</button>`:`<button class="btn o" onclick="cancelB(${id})">${t("cancel")}</button>`}</div>`}
  h+=`<div class="row2"><button class="btn" onclick="cmd(${id},'wake')">⏻ ${t("wake")}</button><button class="btn" onclick="cmd(${id},'shutdown')">${t("shut")}</button></div><div class="row2"><button class="btn" onclick="cmd(${id},'restart')">↻ ${t("restart")}</button></div>`;
  $("#box").innerHTML=h;$("#modal").classList.add("open");document.body.classList.add("lock");tick()}
function closeM(){$("#modal").classList.remove("open");document.body.classList.remove("lock")}
function applyLang(){document.documentElement.lang=L;document.querySelectorAll("[data-i]").forEach(e=>e.textContent=t(e.dataset.i));document.querySelectorAll("[data-ph]").forEach(e=>e.placeholder=t(e.dataset.ph));document.querySelectorAll(".lang button").forEach(b=>b.classList.toggle("on",b.dataset.l==L));if(!$("#app").classList.contains("hide"))render()}
function start(){$("#login").classList.add("hide");$("#app").classList.remove("hide");SIG="";LASTNEW=-1;refresh(true).catch(e=>toast(t("err")+": "+e.message));
  clearInterval(PL);clearInterval(TM);PL=setInterval(()=>{if(!document.hidden)refresh().catch(()=>{})},POLL_MS);TM=setInterval(tick,1000)}
document.addEventListener("click",e=>{
  const l=e.target.closest("[data-l]");if(l){L=l.dataset.l;try{localStorage.setItem("lang",L)}catch(x){}closeM();applyLang();return}
  const rc=e.target.closest("[data-rc]");if(rc)openReceipt(rc.dataset.rc);
  const pb=e.target.closest("[data-pid]");if(pb)cartAdd(pb.dataset.pid);
  const cl=e.target.closest("[data-cl]");if(cl)openClient(cl.dataset.cl);
  const tb=e.target.closest("[data-tab]");if(tb){tab=tb.dataset.tab;SIG="";refresh(true).catch(()=>{})}
  const p=e.target.closest(".pc");if(p&&p.dataset.id)openSeat(p.dataset.id);
  if(e.target==$("#modal"))closeM()});
$("#go").onclick=login;$("#out").onclick=logout;
document.addEventListener("keydown",e=>{if(e.key=="Escape")closeM();if(e.key=="Enter"){if(e.target.id=="pw"||e.target.id=="em")login();else if(e.target.classList&&e.target.classList.contains("pc"))openSeat(e.target.dataset.id)}});
applyLang();if(AUTH)start();
</script></body></html>
