.box{width:100%;max-width:460px;max-height:88vh;overflow:auto;padding:24px;background:#202020}.x{float:right;background:none;border:0;color:var(--mu);font-size:1.8rem;line-height:1;cursor:pointer}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);max-width:92vw;text-align:center;background:#202020;border:1px solid var(--brand);padding:12px 20px;border-radius:12px;display:none;z-index:200;font-size:.9rem}
@media(hover:hover){.btn:hover{border-color:var(--brand)}.pc:hover{transform:translateY(-3px)}}
@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr);gap:10px}.modal{align-items:flex-end;padding:0}.box{max-width:100%;border-radius:22px 22px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom,0px))}}

/* ===== auth + api ===== */
let AUTH=null;try{AUTH=JSON.parse(localStorage.getItem("gk_auth")||"null")}catch(e){}
function saveAuth(j){AUTH={access_token:j.access_token,refresh_token:j.refresh_token,expires_at:j.expires_at||Math.floor(Date.now()/1000)+(j.expires_in||3600)};try{localStorage.setItem("gk_auth",JSON.stringify(AUTH))}catch(e){}}
async function ensureToken(){if(!AUTH)throw new Error("auth");if(AUTH.expires_at-60<Date.now()/1000){
  const r=await fetch(SB.url+"/auth/v1/token?grant_type=refresh_token",{method:"POST",headers:{apikey:SB.key,"Content-Type":"application/json"},body:JSON.stringify({refresh_token:AUTH.refresh_token})});
  if(!r.ok){logout();throw new Error("auth")}saveAuth(await r.json())}}
async function api(path,opts){opts=opts||{};await ensureToken();
  const r=await fetch(SB.url+path,{...opts,headers:{apikey:SB.key,Authorization:"Bearer "+AUTH.access_token,"Content-Type":"application/json",...(opts.headers||{})}});
  if(r.status==401){logout();throw new Error("auth")}
  if(!r.ok){let m="";try{m=(await r.json()).message}catch(e){}throw new Error(m||r.status)}
  const tx=await r.text();return tx?JSON.parse(tx):null}
const rpc=(fn,b)=>api("/rest/v1/rpc/"+fn,{method:"POST",body:JSON.stringify(b||{})});
async function login(){$("#err").textContent="";const b=$("#go");b.disabled=true;
  try{const r=await fetch(SB.url+"/auth/v1/token?grant_type=password",{method:"POST",headers:{apikey:SB.key,"Content-Type":"application/json"},body:JSON.stringify({email:$("#em").value.trim(),password:$("#pw").value})});
    if(!r.ok){$("#err").textContent=t("wrong");return}
    saveAuth(await r.json());
    if(!(await rpc("is_admin"))){logout();$("#err").textContent=t("noadmin");return}
    start()}catch(e){$("#err").textContent=t("err")+": "+e.message}finally{b.disabled=false}}
function logout(){AUTH=null;try{localStorage.removeItem("gk_auth")}catch(e){}clearInterval(TM);clearInterval(PL);$("#app").classList.add("hide");$("#login").classList.remove("hide");$("#pw").value=""}
/* ===== state ===== */
let tab="seats",D={pcs:[],reqs:[],rev:0,log:[],hp:{}},SIG="",PL=null,TM=null,LASTNEW=-1;
const online=p=>p.last_seen&&Date.now()-new Date(p.last_seen).getTime()<ONLINE_MS;
function toast(x){const e=$("#toast");e.textContent=x;e.style.display="block";clearTimeout(toast.h);toast.h=setTimeout(()=>e.style.display="none",3200)}
async function refresh(force){
  const d0=new Date();d0.setHours(0,0,0,0);
  const [pcs,reqs,sess,log]=await Promise.all([
    api("/rest/v1/pcs?select=id,zone,status,client,phone,session_end,last_seen,mac,unlock_code,unlocked&order=id"),
    api("/rest/v1/requests?select=id,pc_id,tariff_label,hours,price,eta,name,phone,receipt,receipt_path,state,code,created_at&state=neq.rejected&order=created_at.desc&limit=40"),
    api("/rest/v1/sessions?select=price&started_at=gte."+encodeURIComponent(d0.toISOString())),
    tab=="log"?api("/rest/v1/log?select=ts,text&order=ts.desc&limit=60"):Promise.resolve(D.log)]);
  if(!Object.keys(D.hp).length){const tf=await api("/rest/v1/tariffs?select=zone,price&key=eq.hour");tf.forEach(x=>D.hp[x.zone]=x.price)}
  D.pcs=pcs;D.reqs=reqs;D.log=log;D.rev=sess.reduce((a,s)=>a+s.price,0);
  const pend=reqs.filter(r=>r.state=="new").length;
  if(LASTNEW>=0&&pend>LASTNEW){toast(t("newReq"));document.title="("+pend+") goku Admin"}if(!pend)document.title="goku eSports — Admin";LASTNEW=pend;
  const sig=JSON.stringify([pcs.map(p=>({...p,last_seen:0,o:online(p)})),reqs,D.rev,tab,log.length&&log[0]]);
  if(force||sig!==SIG){SIG=sig;render()}}
function render(){
  const c=k=>D.pcs.filter(p=>p.status==k).length,pend=D.reqs.filter(r=>r.state=="new").length;
  $("#stats").innerHTML=[[c("available"),"free","var(--ok)"],[c("occupied"),"occ","var(--busy)"],[c("booked"),"bk","var(--bk)"],[money(D.rev),"rev","var(--brand)"],[pend,"pend","var(--tx)"]].map(x=>`<div class="glass"><b style="color:${x[2]}">${x[0]}</b><span>${t(x[1])}</span></div>`).join("");
  $("#tabs").innerHTML=["seats","req","log","dev"].map(k=>`<span class="tab ${tab==k?"on":""}" data-tab="${k}">${t(k)}${k=="req"&&pend?`<span class="bd">${pend}</span>`:""}</span>`).join("");

  if(tab=="req")v.innerHTML=D.reqs.length?D.reqs.map(r=>{const lb=r.tariff_label?(r.tariff_label[L]||r.tariff_label.ru):r.hours+" "+t("hours");

  tick()}
function tick(){document.querySelectorAll(".tm").forEach(e=>{const p=D.pcs.find(x=>x.id==e.dataset.id);if(!p)return;if(!p.session_end){e.textContent=t("waitC");return}const r=new Date(p.session_end)-Date.now();e.classList.toggle("over",r<=0);
  e.textContent=r<=0?t("over"):t("left")+" "+(Math.floor(r/3600000))+":"+pad(Math.floor(r%3600000/60000))+":"+pad(Math.floor(r%60000/1000))})}
/* ===== actions ===== */
async function act(fn,b,msg){try{const r=await rpc(fn,b);toast(msg||t("sent"));await refresh(true);return r}catch(e){toast(t("err")+": "+e.message)}}
async function confirmR(id){const c=await act("confirm_request",{p_id:id},null);if(c)toast(t("code")+": "+c)}

function cmd(id,a){closeM();act("send_command",{p_pc:id,p_action:a})}
function endS(id,sd){closeM();act("end_session",{p_pc:id,p_shutdown:sd})}
function extend(id,m){const p=D.pcs.find(x=>x.id==id);closeM();act("extend_session",{p_pc:id,p_minutes:m,p_price:Math.round((D.hp[p.zone]||0)*m/60)})}
function startForm(id){const s=$("#fh"),o=s.selectedOptions[0],b={p_pc:id,p_client:$("#fn").value,p_phone:$("#fp").value,p_hours:+s.value,p_price:+o.dataset.p};closeM();act("start_session",b)}
async function patchPc(id,body){try{await api("/rest/v1/pcs?id=eq."+id,{method:"PATCH",headers:{Prefer:"return=minimal"},body:JSON.stringify(body)});closeM();await refresh(true)}catch(e){toast(t("err")+": "+e.message)}}
const bookForm=id=>patchPc(id,{status:"booked",client:$("#fn").value,phone:$("#fp").value});
const cancelB=id=>patchPc(id,{status:"available",client:null,phone:null});
function openSeat(id){const p=D.pcs.find(x=>x.id==id);if(!p)return;let h=`<button class="x" aria-label="Close" onclick="closeM()">×</button><h2>PC ${pad(id)} · ${esc(ZN[p.zone]||p.zone)}</h2><p class="pc ${p.status}" style="border:0;box-shadow:none;background:none;padding:0;cursor:default"><span class="st"><i class="dot"></i>${t(p.status)}</span> · ${online(p)?t("on"):t("off")}</p>`;
  if(p.status=="occupied")h+=`<p style="margin-top:10px">${esc(p.client||"—")} · <b class="tm" data-id="${id}"></b></p><p class="live">${t("codePc")}: <b class="g">${esc(p.unlock_code||"—")}</b></p>${p.unlocked?"":`<div class="row2"><button class="btn p" onclick="unlockPc(${id})">${t("unlockB")}</button></div>`}<div class="row2"><button class="btn" onclick="extend(${id},30)">+30 ${t("min")}</button><button class="btn" onclick="extend(${id},60)">+60 ${t("min")}</button></div><div class="row2"><button class="btn r" onclick="endS(${id},true)">${t("end")}</button></div><div class="row2"><button class="btn" onclick="endS(${id},false)">${t("endk")}</button></div>`;
  else{const hp=D.hp[p.zone]||0;h+=`<input id="fn" placeholder="${t("client")}" value="${esc(p.client||"")}"><input id="fp" type="tel" placeholder="${t("phone")}" value="${esc(p.phone||"")}"><select id="fh">${[1,2,3,5].map(n=>`<option value="${n}" data-p="${n*hp}">${n} ${t("hours")} — ${money(n*hp)}</option>`).join("")}</select><div class="row2"><button class="btn p" onclick="startForm(${id})">${p.status=="booked"?t("checkin"):t("start")}</button>${p.status=="available"?`<button class="btn o" onclick="bookForm(${id})">${t("bookb")}</button>`:`<button class="btn o" onclick="cancelB(${id})">${t("cancel")}</button>`}</div>`}
  h+=`<div class="row2"><button class="btn" onclick="cmd(${id},'wake')">⏻ ${t("wake")}</button><button class="btn" onclick="cmd(${id},'shutdown')">${t("shut")}</button></div><div class="row2"><button class="btn" onclick="cmd(${id},'restart')">↻ ${t("restart")}</button></div>`;
  $("#box").innerHTML=h;$("#modal").classList.add("open");document.body.classList.add("lock");tick()}
function closeM(){$("#modal").classList.remove("open");document.body.classList.remove("lock")}
function applyLang(){document.documentElement.lang=L;document.querySelectorAll("[data-i]").forEach(e=>e.textContent=t(e.dataset.i));document.querySelectorAll("[data-ph]").forEach(e=>e.placeholder=t(e.dataset.ph));document.querySelectorAll(".lang button").forEach(b=>b.classList.toggle("on",b.dataset.l==L));if(!$("#app").classList.contains("hide"))render()}
function start(){$("#login").classList.add("hide");$("#app").classList.remove("hide");SIG="";LASTNEW=-1;refresh(true).catch(e=>toast(t("err")+": "+e.message));
  clearInterval(PL);clearInterval(TM);PL=setInterval(()=>{if(!document.hidden)refresh().catch(()=>{})},POLL_MS);TM=setInterval(tick,1000)}
document.addEventListener("click",e=>{
  const l=e.target.closest("[data-l]");if(l){L=l.dataset.l;try{localStorage.setItem("lang",L)}catch(x){}closeM();applyLang();return}
  const rc=e.target.closest("[data-rc]");if(rc)openReceipt(rc.dataset.rc);
  const tb=e.target.closest("[data-tab]");if(tb){tab=tb.dataset.tab;SIG="";refresh(true).catch(()=>{})}
  const p=e.target.closest(".pc");if(p&&p.dataset.id)openSeat(p.dataset.id);
  if(e.target==$("#modal"))closeM()});
$("#go").onclick=login;$("#out").onclick=logout;
document.addEventListener("keydown",e=>{if(e.key=="Escape")closeM();if(e.key=="Enter"){if(e.target.id=="pw"||e.target.id=="em")login();else if(e.target.classList&&e.target.classList.contains("pc"))openSeat(e.target.dataset.id)}});
applyLang();if(AUTH)start();
</script></body></html>
