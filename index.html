function zoneOf(id){let n=0;for(const z of CONFIG.zones){n+=z.count;if(id<=n)return z}return CONFIG.zones[CONFIG.zones.length-1]}
async function sb(fn,body){const r=await fetch(CONFIG.supabase.url+"/rest/v1/rpc/"+fn,{method:"POST",headers:{apikey:CONFIG.supabase.key,Authorization:"Bearer "+CONFIG.supabase.key,"Content-Type":"application/json"},body:JSON.stringify(body||{})});
  if(!r.ok){let m="";try{m=(await r.json()).message||""}catch(e){}throw new Error(m||r.status)}
  const x=await r.text();return x?JSON.parse(x):null}
let MYREQ=null,REQ=null,ERRSHOWN=false;try{MYREQ=JSON.parse(localStorage.getItem("ig_req")||"null")}catch(e){}
async function pollReq(){if(!MYREQ){REQ=null;return}try{const r=await sb("get_request",{p_id:MYREQ.id,p_token:MYREQ.token});
  if(r&&r[0])REQ={state:r[0].state,code:r[0].code,pc:r[0].pc_id,tariff:r[0].label};else{REQ=null;MYREQ=null;try{localStorage.removeItem("ig_req")}catch(e){}}}catch(e){}}
let L="ru";try{L=localStorage.getItem("lang")||(/^kk|kz/i.test(navigator.language)?"kk":"ru")}catch(e){}
const t=k=>T[L][k];
const DEMO_STATUS=Array.from({length:CONFIG.pcCount},(_,i)=>({id:i+1,status:["available","available","occupied","booked","available","occupied"][i%6]}));
let data=[],filter="all",sel=null;
const $=s=>document.querySelector(s);
function toast(x){const e=$("#toast");e.textContent=x;e.style.display="block";setTimeout(()=>e.style.display="none",2800)}
function render(){
  const zd=data.filter(p=>zoneOf(p.id).id==zone),zc=CONFIG.zones.find(x=>x.id==zone);
  renderTariffs();
  $("#zones").innerHTML=CONFIG.zones.map(z=>`<span class="chip ${zone==z.id?"on":""}" data-z="${z.id}">${zn(z.name)} · ${data.filter(p=>zoneOf(p.id).id==z.id&&p.status=="available").length}/${z.count}</span>`).join("");
  $("#zinfo").innerHTML=Object.entries(zc.specs).map(([k,v])=>`<div><span>${t("sp")[k]||k}</span><b>${v}</b></div>`).join("");
  $("#filters").innerHTML=["all","available","occupied","booked"].map(k=>`<span class="chip ${filter==k?"on":""}" data-f="${k}">${t(k)} (${k=="all"?zd.length:zd.filter(p=>p.status==k).length})</span>`).join("");
  $("#grid").innerHTML=data.filter(p=>(filter=="all"||p.status==filter)&&zoneOf(p.id).id==zone).map(p=>`<div class="pc glass ${p.status} ${sel==p.id?"sel":""}" data-id="${p.id}" tabindex="0" role="button"><div class="n">PC ${String(p.id).padStart(2,"0")}</div><div class="st"><i class="dot"></i>${t(p.status)}</div><small>${zn(zoneOf(p.id).name)}</small><div class="sp">${t("specs")}</div></div>`).join("");
  $("#mini").innerHTML=data.map(p=>`<i class="m ${p.status}" title="PC ${p.id}"></i>`).join("");
  $("#stFree").textContent=data.filter(p=>p.status=="available").length;
  renderTrack();
  $("#selTxt").textContent=sel?"PC "+String(sel).padStart(2,"0")+" · "+zn(zoneOf(sel).name):t("none");
  const r=CONFIG.reviews;
  $("#rv").innerHTML=r.length?r.map(x=>`<div class="glass rv"><div class="stars">${"★".repeat(x.rating)}</div><p>${x.text}</p><small class="live">${x.name} · ${x.date||""}</small></div>`).join(""):`<div class="glass empty" style="grid-column:1/-1">${t("r3")}<br><br><a class="btn p" target="_blank" rel="noopener" href="${CONFIG.reviewsUrl}">${t("r4")}</a></div>`;
  $("#rules-list").innerHTML=CONFIG.rules[L].map((x,i)=>`<div class="glass rl"><b>${i+1}</b><span>${x}</span></div>`).join("")+`<div class="glass sg">${CONFIG.rulesNote[L]}</div>`;
}
function applyLang(){
  document.documentElement.lang=L;
  document.querySelectorAll("[data-i]").forEach(e=>e.innerHTML=t(e.dataset.i));
  document.querySelectorAll(".lang button").forEach(b=>b.classList.toggle("on",b.dataset.l==L));
  render();
}
let SIG="";
async function load(){try{data=await CONFIG.fetchAvailability();$("#updT").textContent=new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"});
  const sp=data.find(p=>p.id==sel);if(sel&&(!sp||sp.status!="available")&&!$("#modal").classList.contains("open"))sel=null;
  await pollReq();ERRSHOWN=false;
  const sig=JSON.stringify([data,REQ,sel]);if(sig!==SIG){SIG=sig;render()}}catch(e){if(!ERRSHOWN){ERRSHOWN=true;toast(t("err"))}}}
function openPC(id){
  const p=data.find(x=>x.id==id);if(!p)return;const s={...zoneOf(+id).specs,...(CONFIG.specs[id]||{})};
  $("#box").innerHTML=`<button class="x" aria-label="Close" onclick="closeM()">×</button><h2>PC ${String(id).padStart(2,"0")} · ${zn(zoneOf(+id).name)}</h2><p class="pc ${p.status}" style="border:0;box-shadow:none;background:none;padding:0;cursor:default"><span class="st" style="color:var(--s)"><i class="dot"></i>${t(p.status)}</span></p><div style="margin:12px 0">${Object.entries(s).map(([k,v])=>`<div class="spec"><span>${t("sp")[k]||k}</span><b>${v}</b></div>`).join("")}</div>${p.status=="available"?`<div class="live" style="margin-top:6px">${t("pay")}</div><select id="mt">${tariffList(zoneOf(+id).id).map(x=>`<option value="${x.k}">${zn(x.l)} — ${money(x.p)}</option>`).join("")}</select><button class="btn p stk" style="width:100%;justify-content:center;margin-top:12px" onclick="pick(${id})">${t("pick")}</button>`:`<p class="live">${t("na")}</p>`}`;
  $("#modal").classList.add("open");document.body.classList.add("lock");
}
function closeM(){$("#modal").classList.remove("open");document.body.classList.remove("lock")}
function pick(id){sel=id;const m=$("#mt");selT=m?m.value:null;render();book({preventDefault(){}})}
function pay(e){e.preventDefault();
  const ua=navigator.userAgent,fb=CONFIG.kaspiFallback;
  if(/Android/i.test(ua)){location.href="intent://#Intent;package=kz.kaspi.mobile;S.browser_fallback_url="+encodeURIComponent(fb)+";end";return}
  if(/iPhone|iPad|iPod/i.test(ua)){location.href=CONFIG.kaspiLink;setTimeout(()=>{if(!document.hidden)location.href=fb},1500);return}
  window.open(fb,"_blank","noopener")}
function book(e){e.preventDefault();
  if(!sel){toast(t("needPc"));return document.getElementById("computers").scrollIntoView()}
  $("#box").innerHTML=`<button class="x" aria-label="Close" onclick="closeM()">×</button><h2>${t("omwT")}</h2><p class="live">${t("pcL")}: <b class="g">PC ${String(sel).padStart(2,"0")} · ${zn(zoneOf(sel).name)}</b></p><details class="spkd" ${innerWidth>=700?"open":""}><summary>${t("zs")}</summary>${Object.entries({...zoneOf(sel).specs,...(CONFIG.specs[sel]||{})}).map(([k,v])=>`<div class="spec"><span>${t("sp")[k]||k}</span><b>${v}</b></div>`).join("")}</details><input id="rn" placeholder="${t("nameL")}" autocomplete="name"><input id="rp" type="tel" placeholder="${t("phoneL")}" autocomplete="tel"><div class="live" style="margin-top:12px">${t("pay")}</div><select id="rh">${tariffList(zoneOf(sel).id).map(x=>`<option value="${x.k}" ${x.k==selT?"selected":""}>${zn(x.l)} — ${money(x.p)}</option>`).join("")}</select><select id="re">${[5,10,15,20,30].map(n=>`<option value="${n}">${t("etaL")} ${n} ${t("min")}</option>`).join("")}</select><button class="btn p stk" style="width:100%;margin-top:14px" onclick="sendReq()">${t("send")}</button>`;
  $("#modal").classList.add("open");document.body.classList.add("lock")}
async function sendReq(){const n=$("#rn").value.trim(),ph=$("#rp").value.trim();if(!n||!ph)return toast(t("needName"));
  const b=$("#box .stk");if(b)b.disabled=true;
  try{const r=await sb("create_request",{p_pc:sel,p_tariff:$("#rh").value,p_eta:+$("#re").value,p_name:n,p_phone:ph});
    MYREQ={id:r[0].id,token:r[0].token};try{localStorage.setItem("ig_req",JSON.stringify(MYREQ))}catch(e){}
    closeM();await pollReq();SIG="";render();toast(t("sentT"))}
  catch(e){if(b)b.disabled=false;toast(/pc_unavailable/.test(e.message)?t("taken"):/too_many/.test(e.message)?t("tooMany"):t("err"))}}
function dismissTrack(){MYREQ=null;REQ=null;try{localStorage.removeItem("ig_req")}catch(e){}SIG="";renderTrack()}
function renderTrack(){const el=$("#track");if(!el)return;const r=REQ;
  if(!r){el.innerHTML="";return}
  const m={new:`<div class="trk w">⏳ ${t("waitT")}</div>`,done:`<div class="trk o">✅ ${t("okT")}<br>${t("codeL")}: <b class="g" style="font-size:1.6rem">${r.code||""}</b><br><span class="live">${t("codeHint")}</span></div>`,rejected:`<div class="trk b">❌ ${t("rejT")}</div>`};
  el.innerHTML=`<div class="trk h"><button class="x" aria-label="Close" onclick="dismissTrack()">×</button>PC ${String(r.pc).padStart(2,"0")} · ${r.tariff?zn(r.tariff):""}</div>`+(m[r.state]||"")}
document.addEventListener("click",e=>{
  const l=e.target.closest("[data-l]");if(l){L=l.dataset.l;try{localStorage.setItem("lang",L)}catch(x){}closeM();SIG="";applyLang();return}
  const c=e.target.closest("[data-f]");if(c){filter=c.dataset.f;render()}
  const zz=e.target.closest("[data-z]");if(zz){zone=zz.dataset.z;render()}
  const p=e.target.closest(".pc");if(p&&p.dataset.id)openPC(p.dataset.id);
  if(e.target.closest("[data-book]"))book(e);
  if(e.target.closest("[data-kaspi]"))pay(e);
  if(e.target.closest("[data-receipt]"))receipt(e);
  if(e.target==$("#modal"))closeM();
});
function openWa(){const pcn=REQ?REQ.pc:sel;
  const m=encodeURIComponent(t("msg")+(pcn?t("forpc")+pcn:"")+(REQ&&REQ.tariff?" ("+zn(REQ.tariff)+")":"")+(REQ&&REQ.code?", "+t("codeL").toLowerCase()+": "+REQ.code:"")+".");
  window.open("https://wa.me/"+CONFIG.managerWhatsApp+"?text="+m,"_blank","noopener")}
function receipt(e){e.preventDefault();try{if(MYREQ)sb("mark_receipt",{p_id:MYREQ.id,p_token:MYREQ.token}).catch(()=>{})}catch(z){}openWa()}
document.addEventListener("keydown",e=>{if(e.key=="Escape")closeM();if(e.key=="Enter"&&e.target.classList&&e.target.classList.contains("pc")&&e.target.dataset.id)openPC(e.target.dataset.id)});
document.documentElement.classList.add("js");
const secs=document.querySelectorAll("section");secs.forEach(x=>x.classList.add("rvl"));
if("IntersectionObserver" in window){const io=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){x.target.classList.add("in");io.unobserve(x.target)}}),{threshold:.05});secs.forEach(x=>io.observe(x))}else secs.forEach(x=>x.classList.add("in"));
(function(){const h=$("#bgfx"),N=innerWidth<700?10:22,r=(a,b)=>a+Math.random()*(b-a);
  for(let i=0;i<N;i++){const e=document.createElement("i"),z=r(6,18);e.className="pt";e.style.cssText=`left:${r(0,100)}%;top:100%;width:${z}px;height:${z}px;--x:${r(-80,80)}px;--f:${r(22,48)}s;animation-delay:-${r(0,48)}s`;h.appendChild(e)}})();
applyLang();load();setInterval(()=>{if(!document.hidden)load()},CONFIG.refreshMs);
</script></body></html>
